name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # Pinned: Playwright 1.56 cannot install Chromium on ubuntu-latest (26.04) yet.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CELEBRIO_DEMO_MODE: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Validate templates
        run: npm run templates:validate
      - name: Seed file is up to date
        run: npm run db:seed:generate && git diff --exit-code supabase/seed.sql
      - name: Unit tests
        run: npm run test:unit
      - name: Database integration tests (migrations, seed, RLS, payments)
        run: npm run test:integration
      - name: Production build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (guest flows)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
